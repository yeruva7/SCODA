[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoda"
version = "0.2.0"
description = "Scalable Configuration-Driven Automation for multi-tenant, nondeterministic services."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Joseph Sukanth Yeruva" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/yeruva7/SCODA"

[tool.setuptools.packages.find]
include = ["scoda*"]
